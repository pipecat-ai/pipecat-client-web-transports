[project]
name = "pipecat-transports-example-bot"
version = "0.1.0"
description = "Basic bot for exercising the Pipecat web transports"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[cartesia,daily,deepgram,livekit,moq,openai,runner,silero,webrtc,websocket]>=1.14.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
exclude = [".git", "*_pb2.py"]
line-length = 100

[tool.ruff.lint]
select = [
    "I", # Import rules
    "UP", # Modern Python
]
